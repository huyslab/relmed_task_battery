<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELMED Task Battery</title>

    <script type="importmap">
        {
            "imports": {
                "@utils/": "./core/utils/",
                "@jspsych/": "./core/jspsych/",
                "@tasks/": "./tasks/",
                "@api/": "./api/",
                "@images/": "./assets/images/"
            }
        }
    </script>

    <!-- jsPsych and task plugins are needed to import the task registry -->
    <script src="core/jspsych/jspsych.js"></script>
    <script src="core/jspsych/plugin-html-keyboard-response.js"></script>
    <script src="core/jspsych/plugin-html-button-response.js"></script>
    <script src="core/jspsych/plugin-instructions.js"></script>
    <script src="core/jspsych/plugin-preload.js"></script>
    <script src="core/jspsych/plugin-call-function.js"></script>
    <script src="core/jspsych/plugin-fullscreen.js"></script>
    <script src="core/jspsych/plugin-survey-multi-choice.js"></script>
    <script src="core/jspsych/plugin-survey-likert.js"></script>
    <script src="tasks/card-choosing/plugin-card-choosing.js"></script>
    <script src="tasks/control/plugins/plugin-explore-ship.js"></script>
    <script src="tasks/control/plugins/plugin-explore-ship-feedback.js"></script>
    <script src="tasks/control/plugins/plugin-predict-home-base.js"></script>
    <script src="tasks/control/plugins/plugin-reward-ship.js"></script>
    <script src="tasks/control/plugins/plugin-reward-prompt.js"></script>
    <script src="tasks/reversal/plugin-reversal.js"></script>
    <script src="tasks/open-text/plugin-open-text.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 40px 16px;
        }

        .container {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 860px;
            margin: 0 auto;
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            color: #2c3e50;
        }

        .subtitle {
            font-size: 15px;
            color: #7f8c8d;
            margin: 4px 0 24px;
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px 20px;
            margin-bottom: 24px;
        }

        label, .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        input[type="text"], select {
            width: 100%;
            padding: 9px 12px;
            font-size: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            outline: none;
            background: white;
        }

        input[type="text"]:focus, select:focus {
            border-color: #667eea;
        }

        .segmented {
            display: flex;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            overflow: hidden;
        }

        .segmented button {
            flex: 1;
            padding: 9px 8px;
            font-size: 14px;
            border: none;
            background: white;
            color: #555;
            cursor: pointer;
        }

        .segmented button + button {
            border-left: 2px solid #e1e8ed;
        }

        .segmented button.active {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid #e1e8ed;
            margin-bottom: 16px;
        }

        .tabs button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            background: none;
            color: #7f8c8d;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tabs button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .group-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #95a5a6;
            margin: 16px 0 8px;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
        }

        .option {
            text-align: left;
            padding: 12px 14px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font: inherit;
            color: inherit;
        }

        .option:hover:not(:disabled) {
            border-color: #b3bdf3;
        }

        .option.selected {
            border-color: #667eea;
            background: #f3f5fe;
        }

        .option:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .option-name {
            font-weight: 600;
            font-size: 15px;
            color: #2c3e50;
        }

        .option-key {
            font-family: monospace;
            font-size: 12px;
            color: #95a5a6;
            margin-left: 4px;
        }

        .option-desc {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .preview {
            margin-top: 20px;
            padding: 14px 16px;
            background: #f8f9fb;
            border-radius: 8px;
            font-size: 14px;
        }

        .preview ol {
            margin: 8px 0 0 22px;
        }

        .preview li {
            margin: 2px 0;
        }

        .preview .muted {
            color: #95a5a6;
        }

        .preview .skipped {
            color: #b2bec3;
            text-decoration: line-through;
        }

        .launch {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .url-row {
            display: flex;
            gap: 8px;
        }

        .url-row input {
            font-family: monospace;
            font-size: 13px;
            color: #555;
        }

        .secondary-button {
            padding: 0 14px;
            font-size: 14px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            white-space: nowrap;
        }

        .checkbox {
            font-size: 14px;
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .start-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .start-button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            min-height: 1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">RELMED Task Battery</div>
        <div class="subtitle">Preview modules or individual tasks</div>

        <div class="settings">
            <div>
                <label for="participantId">Participant ID</label>
                <input type="text" id="participantId" value="TST" autocomplete="off">
            </div>
            <div>
                <span class="label">Context</span>
                <div class="segmented" id="context">
                    <button type="button" data-value="relmed">RELMED</button>
                    <button type="button" data-value="prolific">Prolific</button>
                </div>
            </div>
            <div>
                <label for="session">Session</label>
                <select id="session"></select>
            </div>
            <div>
                <span class="label">Run mode</span>
                <div class="segmented" id="runMode">
                    <button type="button" data-value="regular">Regular</button>
                    <button type="button" data-value="simulate">Simulate</button>
                </div>
            </div>
        </div>

        <div class="tabs" id="mode">
            <button type="button" data-value="module">Module mode</button>
            <button type="button" data-value="task">Single task mode</button>
        </div>

        <div id="optionList"></div>
        <div class="preview" id="preview"></div>

        <div class="launch">
            <div class="url-row">
                <input type="text" id="url" readonly>
                <button type="button" class="secondary-button" id="copyButton">Copy</button>
            </div>
            <label class="checkbox"><input type="checkbox" id="newTab"> Open in new tab</label>
            <button type="button" class="start-button" id="startButton">Start</button>
            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <script type="module">
        import { TaskRegistry } from '@api/task-registry.js';
        import { ModuleRegistry } from '@api/module-registry.js';
        import { isElementIncluded } from '@api/utils.js';

        // Modules replicating relmed_trial1, in the order they are run within a session
        const TRIAL1_MODULES = ['screening', 'pilt_to_test', 'wm', 'reversal', 'control', 'quests'];
        const STORAGE_KEY = 'relmed_task_selector';

        // Sessions: everything any module or task sequence supports, screening first then by week
        const sessions = [...new Set([
            ...Object.values(ModuleRegistry).flatMap(m => m.sessions || []),
            ...Object.values(TaskRegistry).flatMap(t => Object.keys(t.sequences || {}))
        ])].sort((a, b) => (a === 'screening' ? -1 : b === 'screening' ? 1 : parseInt(a.slice(2)) - parseInt(b.slice(2))));

        const state = {
            participantId: 'TST',
            context: 'relmed',
            session: 'wk0',
            runMode: 'regular',
            mode: 'module',
            module: 'pilt_to_test',
            task: 'PILT',
            newTab: false
        };

        try {
            Object.assign(state, JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'));
        } catch (e) {}

        const el = (id) => document.getElementById(id);

        const isModuleAvailable = (name) => !ModuleRegistry[name].sessions || ModuleRegistry[name].sessions.includes(state.session);
        const isTaskAvailable = (name) => !TaskRegistry[name].sequences || state.session in TaskRegistry[name].sequences;

        function optionButton(key, name, description, available, selected) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'option' + (selected ? ' selected' : '');
            button.disabled = !available;
            button.dataset.value = key;
            button.innerHTML = `<div><span class="option-name">${name}</span><span class="option-key">${key}</span></div>
                <div class="option-desc">${available ? description : `Not available for ${state.session}`}</div>`;
            button.addEventListener('click', () => {
                state[state.mode] = key;
                render();
            });
            return button;
        }

        function renderGroup(container, title, keys, makeButton) {
            if (!keys.length) return;
            const heading = document.createElement('div');
            heading.className = 'group-title';
            heading.textContent = title;
            const grid = document.createElement('div');
            grid.className = 'options';
            keys.forEach(key => grid.appendChild(makeButton(key)));
            container.append(heading, grid);
        }

        function renderOptions() {
            const container = el('optionList');
            container.innerHTML = '';

            if (state.mode === 'module') {
                const moduleButton = (key) => {
                    const module = ModuleRegistry[key];
                    return optionButton(key, module.name, module.description || '', isModuleAvailable(key), state.module === key);
                };
                const moduleKeys = Object.keys(ModuleRegistry);
                renderGroup(container, 'RELMED trial 1 modules', TRIAL1_MODULES.filter(k => k in ModuleRegistry), moduleButton);
                renderGroup(container, 'Custom modules', moduleKeys.filter(k => !TRIAL1_MODULES.includes(k)), moduleButton);
            } else {
                renderGroup(container, 'Tasks', Object.keys(TaskRegistry), (key) => {
                    const task = TaskRegistry[key];
                    return optionButton(key, task.name, task.description, isTaskAvailable(key), state.task === key);
                });
            }
        }

        function describeElement(element) {
            if (element.type === 'task') {
                const label = TaskRegistry[element.name]?.name || element.name;
                return element.name === 'acceptability_judgment' ? `${label} (${element.config?.task_name})` : label;
            }
            if (element.type === 'instructions') return `<span class="muted">Message: ${element.config.text}</span>`;
            if (element.type === 'bonus') return '<span class="muted">Bonus</span>';
            return element.type;
        }

        function renderPreview() {
            const preview = el('preview');
            if (state.mode === 'module') {
                const module = ModuleRegistry[state.module];
                const settings = { ...module.moduleConfig, session: state.session, context: state.context };
                const items = module.elements.map(element => isElementIncluded(element, settings) ?
                    `<li>${describeElement(element)}</li>` :
                    `<li class="skipped">${describeElement(element)}</li>`);
                preview.innerHTML = `<b>${module.name}</b> at ${state.session}, ${state.context} context
                    <ol>${items.join('')}</ol>`;
            } else {
                const task = TaskRegistry[state.task];
                const sequences = task.sequences ? Object.keys(task.sequences).join(', ') : 'none (session independent)';
                preview.innerHTML = `<b>${task.name}</b>: ${task.description}
                    <div class="muted" style="margin-top: 6px;">Sequences: ${sequences}</div>`;
            }
        }

        function buildUrl() {
            const params = new URLSearchParams({
                participant_id: state.participantId,
                context: state.context,
                session: state.session,
                [state.mode]: state[state.mode]
            });
            if (state.runMode === 'simulate') params.set('simulate', 'true');
            return new URL(`experiment.html?${params}`, window.location.href).href;
        }

        function validate() {
            if (!state.participantId) return 'Please enter a participant ID';
            if (!/^[a-zA-Z0-9_-]+$/.test(state.participantId)) return 'Participant ID can only contain letters, numbers, hyphens, and underscores';
            if (state.mode === 'module' && !isModuleAvailable(state.module)) return `${ModuleRegistry[state.module].name} is not available for ${state.session}`;
            if (state.mode === 'task' && !isTaskAvailable(state.task)) return `${TaskRegistry[state.task].name} has no sequence for ${state.session}`;
            return '';
        }

        function render() {
            // Fall back to defaults if stored selections no longer exist
            if (!(state.module in ModuleRegistry)) state.module = Object.keys(ModuleRegistry)[0];
            if (!(state.task in TaskRegistry)) state.task = Object.keys(TaskRegistry)[0];
            if (!sessions.includes(state.session)) state.session = sessions[0];

            for (const id of ['context', 'runMode', 'mode']) {
                el(id).querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.value === state[id]));
            }
            el('session').value = state.session;

            renderOptions();
            renderPreview();

            const error = validate();
            el('errorMessage').textContent = error;
            el('startButton').disabled = Boolean(error);
            el('url').value = error ? '' : buildUrl();
            el('startButton').textContent = state.runMode === 'simulate' ? 'Start simulation' : 'Start';

            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}
        }

        // Wire up controls
        el('session').innerHTML = sessions.map(s => `<option value="${s}">${s === 'screening' ? 'Screening' : `Week ${s.slice(2)} (${s})`}</option>`).join('');
        for (const id of ['context', 'runMode', 'mode']) {
            el(id).querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
                state[id] = b.dataset.value;
                render();
            }));
        }
        el('session').addEventListener('change', (e) => { state.session = e.target.value; render(); });
        el('participantId').addEventListener('input', (e) => { state.participantId = e.target.value.trim(); render(); });
        el('newTab').addEventListener('change', (e) => { state.newTab = e.target.checked; render(); });
        el('copyButton').addEventListener('click', () => {
            navigator.clipboard?.writeText(el('url').value).then(() => {
                el('copyButton').textContent = 'Copied';
                setTimeout(() => { el('copyButton').textContent = 'Copy'; }, 1500);
            });
        });
        el('startButton').addEventListener('click', () => {
            if (validate()) return;
            if (state.newTab) {
                window.open(buildUrl(), '_blank');
            } else {
                window.location.href = buildUrl();
            }
        });

        el('participantId').value = state.participantId;
        el('newTab').checked = state.newTab;
        render();
    </script>
</body>
</html>
