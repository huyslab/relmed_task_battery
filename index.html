<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELMED Task Battery</title>

    <script type="importmap">
        {
            "imports": {
                "@utils/": "./core/utils/",
                "@jspsych/": "./core/jspsych/",
                "@tasks/": "./tasks/",
                "@api/": "./api/",
                "@images/": "./assets/images/"
            }
        }
    </script>

    <!-- jsPsych and task plugins are needed to import the task registry -->
    <script src="core/jspsych/jspsych.js"></script>
    <script src="core/jspsych/plugin-html-keyboard-response.js"></script>
    <script src="core/jspsych/plugin-html-button-response.js"></script>
    <script src="core/jspsych/plugin-instructions.js"></script>
    <script src="core/jspsych/plugin-preload.js"></script>
    <script src="core/jspsych/plugin-call-function.js"></script>
    <script src="core/jspsych/plugin-fullscreen.js"></script>
    <script src="core/jspsych/plugin-survey-multi-choice.js"></script>
    <script src="core/jspsych/plugin-survey-likert.js"></script>
    <script src="tasks/card-choosing/plugin-card-choosing.js"></script>
    <script src="tasks/control/plugins/plugin-explore-ship.js"></script>
    <script src="tasks/control/plugins/plugin-explore-ship-feedback.js"></script>
    <script src="tasks/control/plugins/plugin-predict-home-base.js"></script>
    <script src="tasks/control/plugins/plugin-reward-ship.js"></script>
    <script src="tasks/control/plugins/plugin-reward-prompt.js"></script>
    <script src="tasks/reversal/plugin-reversal.js"></script>
    <script src="tasks/open-text/plugin-open-text.js"></script>

    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-muted: #f8f9fb;
            --border: #e5e7eb;
            --border-strong: #d1d5db;
            --text: #111827;
            --text-muted: #6b7280;
            --text-faint: #9ca3af;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: #eef2ff;
            --accent-text: #ffffff;
            --danger: #dc2626;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
            --radius: 12px;
            --radius-sm: 8px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d0f13;
                --surface: #16191f;
                --surface-muted: #1c2027;
                --border: #262b33;
                --border-strong: #353b45;
                --text: #f3f4f6;
                --text-muted: #9ca3af;
                --text-faint: #6b7280;
                --accent: #818cf8;
                --accent-hover: #a5b4fc;
                --accent-soft: rgba(129, 140, 248, 0.12);
                --accent-text: #0d0f13;
                --danger: #f87171;
                --shadow: none;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        button, input, select {
            font: inherit;
            color: inherit;
        }

        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 40px 16px 48px;
        }

        header {
            margin-bottom: 28px;
        }

        h1 {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 2px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* Settings */
        .settings {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            padding: 18px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) {
            .settings {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"], select {
            width: 100%;
            height: 36px;
            padding: 0 10px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--surface);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .segmented {
            display: flex;
            height: 36px;
            padding: 3px;
            gap: 2px;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .segmented button {
            flex: 1;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .segmented button:hover {
            color: var(--text);
        }

        .segmented button.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            .segmented button.active {
                background: var(--border-strong);
            }
        }

        /* Mode switch */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .toolbar .segmented {
            flex: 0 1 280px;
        }

        .count {
            color: var(--text-faint);
            font-size: 13px;
            white-space: nowrap;
        }

        /* Option list */
        .group-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin: 20px 0 8px;
        }

        .group-title:first-child {
            margin-top: 0;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 8px;
        }

        .option {
            display: flex;
            gap: 12px;
            text-align: left;
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .option:hover:not(:disabled) {
            border-color: var(--border-strong);
        }

        .option.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .option:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .radio {
            flex: none;
            width: 16px;
            height: 16px;
            margin-top: 2px;
            border: 1.5px solid var(--border-strong);
            border-radius: 50%;
            transition: border 0.15s;
        }

        .option.selected .radio {
            border: 5px solid var(--accent);
        }

        .option-body {
            min-width: 0;
        }

        .option-name {
            font-weight: 600;
        }

        .option-key {
            display: inline-block;
            margin-left: 6px;
            padding: 0 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: 4px;
            vertical-align: 1px;
        }

        .option-desc {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 2px;
        }

        /* Summary panel */
        .summary {
            position: sticky;
            top: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .summary-title {
            font-size: 16px;
            font-weight: 600;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .chip {
            padding: 1px 8px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: 999px;
        }

        .chip.accent {
            color: var(--accent);
            border-color: transparent;
            background: var(--accent-soft);
        }

        .steps {
            list-style: none;
            counter-reset: step;
            max-height: 340px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .steps li {
            counter-increment: step;
            display: flex;
            gap: 10px;
            padding: 3px 0;
        }

        .steps li::before {
            content: counter(step);
            flex: none;
            width: 20px;
            height: 20px;
            margin-top: 1px;
            font-size: 11px;
            font-weight: 600;
            line-height: 20px;
            text-align: center;
            color: var(--text-muted);
            background: var(--surface-muted);
            border-radius: 50%;
        }

        .steps li.minor {
            color: var(--text-muted);
        }

        .steps li.skipped {
            counter-increment: none;
            color: var(--text-faint);
            text-decoration: line-through;
        }

        .steps li.skipped::before {
            content: "–";
            background: none;
        }

        .description {
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .meta {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-faint);
        }

        .url-row {
            display: flex;
            gap: 6px;
        }

        .url-row input {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--surface-muted);
        }

        .ghost-button {
            flex: none;
            height: 36px;
            padding: 0 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--surface);
            font-weight: 500;
            cursor: pointer;
        }

        .ghost-button:hover {
            background: var(--surface-muted);
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox input {
            accent-color: var(--accent);
        }

        .start-button {
            height: 42px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--accent-text);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .start-button:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .start-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .error-message {
            color: var(--danger);
            font-size: 13px;
        }

        .error-message:empty {
            display: none;
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>RELMED Task Battery</h1>
            <div class="subtitle">Preview a full module or a single task</div>
        </header>

        <div class="layout">
            <main>
                <section class="card settings">
                    <div>
                        <label class="field-label" for="participantId">Participant ID</label>
                        <input type="text" id="participantId" value="TST" autocomplete="off" spellcheck="false">
                    </div>
                    <div>
                        <span class="field-label">Context</span>
                        <div class="segmented" id="context">
                            <button type="button" data-value="relmed">RELMED</button>
                            <button type="button" data-value="prolific">Prolific</button>
                        </div>
                    </div>
                    <div>
                        <label class="field-label" for="session">Session</label>
                        <select id="session"></select>
                    </div>
                    <div>
                        <span class="field-label">Run mode</span>
                        <div class="segmented" id="runMode">
                            <button type="button" data-value="regular">Regular</button>
                            <button type="button" data-value="simulate">Simulate</button>
                        </div>
                    </div>
                </section>

                <div class="toolbar">
                    <div class="segmented" id="mode">
                        <button type="button" data-value="module">Modules</button>
                        <button type="button" data-value="task">Single tasks</button>
                    </div>
                    <span class="count" id="count"></span>
                </div>

                <div id="optionList"></div>
            </main>

            <aside class="card summary">
                <div id="preview"></div>
                <div class="url-row">
                    <input type="text" id="url" readonly aria-label="Experiment URL">
                    <button type="button" class="ghost-button" id="copyButton">Copy</button>
                </div>
                <label class="checkbox"><input type="checkbox" id="newTab"> Open in new tab</label>
                <button type="button" class="start-button" id="startButton">Start</button>
                <div class="error-message" id="errorMessage"></div>
            </aside>
        </div>
    </div>

    <script type="module">
        import { TaskRegistry } from '@api/task-registry.js';
        import { ModuleRegistry } from '@api/module-registry.js';
        import { isElementIncluded } from '@api/utils.js';

        // Modules replicating relmed_trial1, in the order they are run within a session
        const TRIAL1_MODULES = ['screening', 'pilt_to_test', 'wm', 'reversal', 'control', 'quests'];
        const STORAGE_KEY = 'relmed_task_selector';

        // Sessions: everything any module or task sequence supports, screening first then by week
        const sessions = [...new Set([
            ...Object.values(ModuleRegistry).flatMap(m => m.sessions || []),
            ...Object.values(TaskRegistry).flatMap(t => Object.keys(t.sequences || {}))
        ])].sort((a, b) => (a === 'screening' ? -1 : b === 'screening' ? 1 : parseInt(a.slice(2)) - parseInt(b.slice(2))));

        const state = {
            participantId: 'TST',
            context: 'relmed',
            session: 'wk0',
            runMode: 'regular',
            mode: 'module',
            module: 'pilt_to_test',
            task: 'PILT',
            newTab: false
        };

        try {
            Object.assign(state, JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'));
        } catch (e) {}

        const el = (id) => document.getElementById(id);

        const isModuleAvailable = (name) => !ModuleRegistry[name].sessions || ModuleRegistry[name].sessions.includes(state.session);
        const isTaskAvailable = (name) => !TaskRegistry[name].sequences || state.session in TaskRegistry[name].sequences;

        function optionButton(key, name, description, available, selected) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'option' + (selected ? ' selected' : '');
            button.disabled = !available;
            button.dataset.value = key;
            button.innerHTML = `<span class="radio"></span>
                <span class="option-body">
                    <span class="option-name">${name}</span><span class="option-key">${key}</span>
                    <span class="option-desc" style="display: block;">${available ? description : `Not available for ${state.session}`}</span>
                </span>`;
            button.addEventListener('click', () => {
                state[state.mode] = key;
                render();
            });
            return button;
        }

        function renderGroup(container, title, keys, makeButton) {
            if (!keys.length) return;
            const heading = document.createElement('div');
            heading.className = 'group-title';
            heading.textContent = title;
            const grid = document.createElement('div');
            grid.className = 'options';
            keys.forEach(key => grid.appendChild(makeButton(key)));
            container.append(heading, grid);
        }

        function renderOptions() {
            const container = el('optionList');
            container.innerHTML = '';

            if (state.mode === 'module') {
                const moduleButton = (key) => {
                    const module = ModuleRegistry[key];
                    return optionButton(key, module.name, module.description || '', isModuleAvailable(key), state.module === key);
                };
                const moduleKeys = Object.keys(ModuleRegistry);
                renderGroup(container, 'RELMED trial 1', TRIAL1_MODULES.filter(k => k in ModuleRegistry), moduleButton);
                renderGroup(container, 'Custom', moduleKeys.filter(k => !TRIAL1_MODULES.includes(k)), moduleButton);
                el('count').textContent = `${moduleKeys.filter(isModuleAvailable).length} of ${moduleKeys.length} available`;
            } else {
                const taskKeys = Object.keys(TaskRegistry);
                renderGroup(container, 'Tasks', taskKeys, (key) => {
                    const task = TaskRegistry[key];
                    return optionButton(key, task.name, task.description, isTaskAvailable(key), state.task === key);
                });
                el('count').textContent = `${taskKeys.filter(isTaskAvailable).length} of ${taskKeys.length} available`;
            }
        }

        function describeElement(element) {
            if (element.type === 'task') {
                const label = TaskRegistry[element.name]?.name || element.name;
                return element.name === 'acceptability_judgment' ? `${label} (${element.config?.task_name})` : label;
            }
            if (element.type === 'instructions') return `Message: ${element.config.text.replace(/_/g, ' ')}`;
            if (element.type === 'bonus') return 'Bonus';
            return element.type;
        }

        function renderPreview() {
            const chips = [
                state.session === 'screening' ? 'Screening' : `Week ${state.session.slice(2)}`,
                state.context === 'relmed' ? 'RELMED' : 'Prolific'
            ].map(c => `<span class="chip">${c}</span>`).join('') +
                (state.runMode === 'simulate' ? '<span class="chip accent">Simulation</span>' : '');

            const preview = el('preview');
            if (state.mode === 'module') {
                const module = ModuleRegistry[state.module];
                const settings = { ...module.moduleConfig, session: state.session, context: state.context };
                const items = module.elements.map(element => {
                    const classes = [
                        isElementIncluded(element, settings) ? '' : 'skipped',
                        element.type === 'task' ? '' : 'minor'
                    ].join(' ').trim();
                    return `<li class="${classes}">${describeElement(element)}</li>`;
                });
                preview.innerHTML = `<div class="summary-title">${module.name}</div>
                    <div class="chips">${chips}</div>
                    <ol class="steps" style="margin-top: 16px;">${items.join('')}</ol>`;
            } else {
                const task = TaskRegistry[state.task];
                const sequences = task.sequences ? Object.keys(task.sequences).join(', ') : 'session independent';
                preview.innerHTML = `<div class="summary-title">${task.name}</div>
                    <div class="chips">${chips}</div>
                    <div class="description" style="margin-top: 16px;">${task.description}
                        <div class="meta">Sequences: ${sequences}</div>
                    </div>`;
            }
        }

        function buildUrl() {
            const params = new URLSearchParams({
                participant_id: state.participantId,
                context: state.context,
                session: state.session,
                [state.mode]: state[state.mode]
            });
            if (state.runMode === 'simulate') params.set('simulate', 'true');
            return new URL(`experiment.html?${params}`, window.location.href).href;
        }

        function validate() {
            if (!state.participantId) return 'Please enter a participant ID';
            if (!/^[a-zA-Z0-9_-]+$/.test(state.participantId)) return 'Participant ID can only contain letters, numbers, hyphens, and underscores';
            if (state.mode === 'module' && !isModuleAvailable(state.module)) return `${ModuleRegistry[state.module].name} is not available for ${state.session}`;
            if (state.mode === 'task' && !isTaskAvailable(state.task)) return `${TaskRegistry[state.task].name} has no sequence for ${state.session}`;
            return '';
        }

        function render() {
            // Fall back to defaults if stored selections no longer exist
            if (!(state.module in ModuleRegistry)) state.module = Object.keys(ModuleRegistry)[0];
            if (!(state.task in TaskRegistry)) state.task = Object.keys(TaskRegistry)[0];
            if (!sessions.includes(state.session)) state.session = sessions[0];

            for (const id of ['context', 'runMode', 'mode']) {
                el(id).querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.value === state[id]));
            }
            el('session').value = state.session;

            renderOptions();
            renderPreview();

            const error = validate();
            el('errorMessage').textContent = error;
            el('startButton').disabled = Boolean(error);
            el('url').value = error ? '' : buildUrl();
            el('startButton').textContent = state.runMode === 'simulate' ? 'Start simulation' : 'Start';

            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}
        }

        // Wire up controls
        el('session').innerHTML = sessions.map(s => `<option value="${s}">${s === 'screening' ? 'Screening' : `Week ${s.slice(2)}`}</option>`).join('');
        for (const id of ['context', 'runMode', 'mode']) {
            el(id).querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
                state[id] = b.dataset.value;
                render();
            }));
        }
        el('session').addEventListener('change', (e) => { state.session = e.target.value; render(); });
        el('participantId').addEventListener('input', (e) => { state.participantId = e.target.value.trim(); render(); });
        el('newTab').addEventListener('change', (e) => { state.newTab = e.target.checked; render(); });
        el('copyButton').addEventListener('click', () => {
            navigator.clipboard?.writeText(el('url').value).then(() => {
                el('copyButton').textContent = 'Copied';
                setTimeout(() => { el('copyButton').textContent = 'Copy'; }, 1500);
            });
        });
        el('startButton').addEventListener('click', () => {
            if (validate()) return;
            if (state.newTab) {
                window.open(buildUrl(), '_blank');
            } else {
                window.location.href = buildUrl();
            }
        });

        el('participantId').value = state.participantId;
        el('newTab').checked = state.newTab;
        render();
    </script>
</body>
</html>
