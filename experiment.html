<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study</title>

    <script type="importmap">
        {
            "imports": {
                "@utils/": "./core/utils/",
                "@jspsych/": "./core/jspsych/",
                "@tasks/": "./tasks/",
                "@api/": "./api/",
                "@images/": "./assets/images/"
            }
        }
    </script>
    
    <!-- jsPsych Core Files -->
    <script src="core/jspsych/jspsych.js"></script>
    <script src="core/jspsych/plugin-html-keyboard-response.js"></script>
    <script src="core/jspsych/plugin-html-button-response.js"></script>
    <script src="core/jspsych/plugin-instructions.js"></script>
    <script src="core/jspsych/plugin-preload.js"></script>
    <script src="core/jspsych/plugin-call-function.js"></script>
    <script src="core/jspsych/plugin-fullscreen.js"></script>
    <script src="core/jspsych/plugin-survey-multi-choice.js"></script>
    <script src="core/jspsych/plugin-survey-likert.js"></script>

    
    <!-- Task-specific files -->
    <script src="tasks/card-choosing/plugin-card-choosing.js"></script>
    <script src="tasks/control/plugins/plugin-explore-ship.js"></script>
    <script src="tasks/control/plugins/plugin-explore-ship-feedback.js"></script>
    <script src="tasks/control/plugins/plugin-predict-home-base.js"></script>
    <script src="tasks/control/plugins/plugin-reward-ship.js"></script>
    <script src="tasks/control/plugins/plugin-reward-prompt.js"></script>
    <script src="tasks/reversal/plugin-reversal.js"></script>
    <script src="tasks/open-text/plugin-open-text.js"></script>

    
    <!-- Core utilities -->
    <script type="module" src="core/utils/index.js"></script>

    <!-- CSS Styles -->
    <link href="core/jspsych/jspsych.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        #display_element {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .instructions p {
            width: 700px;
            text-align: left;
            margin: 1em 0;
        }
    </style>
</head>
<body>
    <div id="display_element"></div>
    
    <script type="module">
        // Import task registry functions
        import { createModuleTimeline, createTaskTimeline, getModule, getModuleInfo, getTaskInfo } from '@api/index.js';
        import { enterExperiment } from '@utils/index.js';

        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);

        // Context: explicit ?context=, otherwise inferred from relmed_trial1 style PID parameters
        window.context = urlParams.get('context') || (urlParams.has('PROLIFIC_PID') && !urlParams.has('RELMED_PID') ? 'prolific' : 'relmed');
        window.participantID = urlParams.get('participant_id') || urlParams.get('RELMED_PID') || urlParams.get('PROLIFIC_PID') || '';
        window.simulating = urlParams.get('simulate') === 'true' || window.participantID.includes("simulate");
        window.debug = window.participantID.includes("debug") || window.participantID.includes("TST");
        console.log(window.simulating);

        // Configurations
        window.session = urlParams.get('session') || 'wk0';
        window.last_state = urlParams.get('state') || 'none';
        window.session_state = JSON.parse(urlParams.get('session_state') || '{}');
        window.module_start_time = new Date().toISOString();
        window.max_instruction_fails = 3;

        // Run a single task (?task=) or a module (?module=); default module follows the session
        const taskName = urlParams.get('task');
        const moduleName = taskName ? null : (urlParams.get('module') || (window.session == "screening" ? 'screening' : 'full_battery'));
        window.module = moduleName || taskName;
        window.task = window.module; // Tasks check window.task for module-specific behaviour (e.g. "screening")

        // Initialize jsPsych
        window.jsPsych = initJsPsych({
            display_element: 'display_element',
            on_finish: function(data) {
                // Display results
                let message = moduleName === "full_battery" ? '<p>Thank you for participating! Please call the experimenter.</p>' : '<p>Thank you for participating! You may now close this tab.</p>';
                if (window.debug) {
                    message += '<p><a href="index.html">Back to task selector</a></p>';
                }
                jsPsych.getDisplayElement().innerHTML = message;
            }
        });

        const settings = {
            sequence: window.session,
            session: window.session,
            context: window.context,
            // Prolific participants get a shorter response deadline, as in relmed_trial1
            ...(window.context === "prolific" ? { default_response_deadline: 3000 } : {})
        };

        // Function to run the experiment
        async function runExperiment() {
            try {
                // Create the timeline for the selected module or task
                let timeline;
                if (moduleName) {
                    console.log('Module info:', getModuleInfo(moduleName));
                    timeline = await createModuleTimeline(moduleName, settings);
                } else {
                    console.log('Task info:', getTaskInfo(taskName));
                    timeline = await createTaskTimeline(taskName, settings);
                }
                console.log('Timeline created:', timeline);

                // Fullscreen for Prolific and in-lab modules; RELMED home modules run embedded in relmed.ac.uk
                const useFullscreen = window.context === "prolific" || Boolean(moduleName && getModule(moduleName).fullscreen);
                const startExperiment = useFullscreen ? enterExperiment : {
                    type: jsPsychCallFunction,
                    func: () => {},
                    on_start: enterExperiment.on_start
                };

                const exitFullscreen = {
                    type: jsPsychFullscreen,
                    fullscreen_mode: false
                };
                
                // Create the complete timeline
                const fullTimeline = [
                    startExperiment,
                    ...timeline,
                    ...(useFullscreen ? [exitFullscreen] : [])
                ];
                
                // Run the experiment
                if (window.simulating) {
                    console.log('Simulating experiment run...');
                    
                    // Simulation options
                    let simulation_options = {
                            default: {
                                data: {
                                    rt: 200,
                                    speed_up: true,
                                    speed_up_factor: 10,
                                }
                            }
                    }

                    await jsPsych.simulate(fullTimeline, "visual", simulation_options);
                } else {
                    console.log('Running experiment...');
                    await jsPsych.run(fullTimeline);
                }
                
            } catch (error) {
                console.error('Error running experiment:', error);
                jsPsych.getDisplayElement().innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h2>Error Loading Experiment</h2>
                        <p>There was an error loading ${moduleName ? `module "${moduleName}"` : `task "${taskName}"`}:</p>
                        <p><strong>${error.message}</strong></p>
                        <p>Please check the console for more details.</p>
                    </div>
                `;
            }
        }

        // Start the experiment when the page loads
        window.addEventListener('load', runExperiment);
    </script>
</body>
</html>
