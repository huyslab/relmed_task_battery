name: Playwright Tests

# This job used to run a loading-time spec and commit the results into the README. Both
# scripts it called (validation/playwright/load_test.spec.js and
# validation/update-readme-loading.js) were moved out of the repo in b0e09f9 on 2025-07-25
# and the job has failed on every push since. It now runs the cross-device suite under
# validation/playwright/, which is what the name promised all along; the README-generation
# and auto-commit steps are gone with the script that fed them.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite emulates phones and tablets on top of these three engines (see the device
      # matrix in playwright.config.js), so all three are needed even though only desktop
      # projects name them directly.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
